{% extends "base.html" %}

{% block title %}Forgot Password - HireWise AI{% endblock %}

{% block content %}
<div class="container d-flex align-items-center justify-content-center" style="min-height: 85vh;">
    <div class="glass-card p-4 p-md-5 w-100" style="max-width: 500px; border-radius: 28px; backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 20px 40px rgba(0,0,0,0.3);">
        <div class="text-center mb-4">
            <div class="brand-logo mx-auto mb-3" style="width: 55px; height: 55px; border-radius: 14px; font-size: 1.6rem; background: linear-gradient(135deg, #6366f1, #4f46e5); display: flex; align-items: center; justify-content: center; color: white; font-weight: 800; box-shadow: 0 8px 16px rgba(99, 102, 241, 0.3);">H</div>
            <h2 class="fw-bold text-gradient-primary">Forgot Password</h2>
            <p class="text-secondary small">Enter your email address and we'll send you a secure password reset link valid for 15 minutes.</p>
        </div>
        
        <form action="{{ url_for('auth.forgot_password') }}" method="POST">
            <!-- Email Input -->
            <div class="mb-4">
                <label for="email" class="form-label fw-semibold">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0 text-muted" style="border-radius: 12px 0 0 12px; border-color: var(--border-color);">
                        <i class="bi bi-envelope"></i>
                    </span>
                    <input type="email" 
                           class="form-control form-control-custom border-start-0" 
                           id="email" 
                           name="email" 
                           placeholder="Enter your registered email" 
                           style="border-radius: 0 12px 12px 0;"
                           required>
                </div>
            </div>
            
            <!-- Submit Button -->
            <button type="submit" class="btn btn-primary w-100 py-3 fw-bold mb-3 shadow" style="border-radius: 12px; background: linear-gradient(135deg, #6366f1, #4f46e5); border: none; transition: all 0.3s ease;">
                Send Reset Link
            </button>
            
            <!-- Redirect Option -->
            <div class="text-center">
                <a href="{{ url_for('auth.login') }}" class="small fw-semibold text-decoration-none text-gradient-primary">Back to Sign In</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
