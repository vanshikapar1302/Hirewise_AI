<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authenticating - HireWise AI</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .spinner-grow {
            width: 3rem;
            height: 3rem;
            color: #6366f1;
        }
        .loading-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 3rem;
            max-width: 450px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }
    </style>
</head>
<body>
    <div class="loading-card">
        <div class="spinner-grow mb-4" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
        <h3 class="fw-bold mb-2">Connecting to HireWise AI</h3>
        <p class="text-secondary small mb-0" id="status-text">Verifying your credentials securely...</p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Parse token from hash URL parameters
            const hash = window.location.hash;
            if (!hash) {
                showError("No authentication payload found in redirect URL.");
                return;
            }

            const params = new URLSearchParams(hash.replace('#', '?'));
            const accessToken = params.get('access_token');
            const errorDesc = params.get('error_description');

            if (errorDesc) {
                showError(errorDesc);
                return;
            }

            if (!accessToken) {
                showError("Failed to retrieve access token from redirect URL.");
                return;
            }

            // Post token to backend
            fetch('/auth/token-login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    access_token: accessToken
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    document.getElementById('status-text').textContent = "Authentication successful! Redirecting...";
                    window.location.href = '/dashboard';
                } else {
                    showError(data.error || "Failed to log in on server.");
                }
            })
            .catch(err => {
                showError("A connection error occurred while verifying the token: " + err.message);
            });
        });

        function showError(msg) {
            document.getElementById('status-text').innerHTML = 
                `<span class="text-danger fw-semibold">Authentication Error</span><br><span class="text-secondary d-block mt-2">${msg}</span>` +
                `<a href="/login" class="btn btn-sm btn-outline-secondary mt-3 px-3 py-1.5" style="border-radius: 8px;">Return to Login</a>`;
        }
    </script>
</body>
</html>
