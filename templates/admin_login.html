<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Sign In - HireWise AI</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom Style System -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height: 100vh; background-color: var(--bg-app);">
    <div class="glass-card p-4 p-md-5 w-100" style="max-width: 480px; border-radius: 24px;">
        <div class="text-center mb-4">
            <div class="brand-logo bg-danger mx-auto mb-3" style="width: 50px; height: 50px; border-radius: 12px; font-size: 1.5rem; box-shadow: 0 4px 12px rgba(220, 53, 69, 0.3);">A</div>
            <h2 class="fw-bold text-gradient-primary">Admin Portal</h2>
            <p class="text-secondary small">Access system configurations and statistics</p>
        </div>

        <!-- Flash Message Notifications -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="p-0">
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }} alert-dismissible fade show border-0 mb-3" role="alert" style="border-radius: 12px; font-size: 0.85rem;">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}
        
        <form action="{{ url_for('admin.login') }}" method="POST">
            <!-- Email / Username Input -->
            <div class="mb-3">
                <label for="email_or_username" class="form-label fw-semibold">Username or Email</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0 text-muted" style="border-radius: 10px 0 0 10px; border-color: var(--border-color);">
                        <i class="bi bi-envelope"></i>
                    </span>
                    <input type="text" 
                           class="form-control form-control-custom border-start-0" 
                           id="email_or_username" 
                           name="email_or_username" 
                           placeholder="Enter username or email" 
                           style="border-radius: 0 10px 10px 0;"
                           required>
                </div>
            </div>
            
            <!-- Password Input -->
            <div class="mb-3">
                <label for="password" class="form-label fw-semibold">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0 text-muted" style="border-radius: 10px 0 0 10px; border-color: var(--border-color);">
                        <i class="bi bi-lock"></i>
                    </span>
                    <input type="password" 
                           class="form-control form-control-custom border-start-0" 
                           id="password" 
                           name="password" 
                           placeholder="••••••••" 
                           style="border-radius: 0 10px 10px 0;"
                           required>
                </div>
            </div>
            
            <!-- Remember Me -->
            <div class="mb-4 d-flex justify-content-between align-items-center">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="remember" name="remember" style="cursor: pointer;">
                    <label class="form-check-label text-secondary small" for="remember" style="cursor: pointer; user-select: none;">
                        Remember me
                    </label>
                </div>
            </div>
            
            <!-- Submit Button -->
            <button type="submit" class="btn btn-primary w-100 py-3 fw-bold mb-3 shadow btn-danger" style="border-radius: 10px; background: linear-gradient(135deg, #dc3545, #bd2130); border: none;">
                Sign In as Admin
            </button>
            
            <!-- Redirect Option -->
            <div class="text-center">
                <a href="{{ url_for('auth.login') }}" class="small fw-semibold text-decoration-none text-gradient-primary">Go to Student Login</a>
            </div>
        </form>
    </div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
