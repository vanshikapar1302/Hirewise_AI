{% extends "base.html" %}

{% block title %}Reset Password - HireWise AI{% endblock %}

{% block content %}
<div class="container d-flex align-items-center justify-content-center" style="min-height: 85vh;">
    <div class="glass-card p-4 p-md-5 w-100" style="max-width: 500px; border-radius: 28px; backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 20px 40px rgba(0,0,0,0.3);">
        <div class="text-center mb-4">
            <div class="brand-logo mx-auto mb-3" style="width: 55px; height: 55px; border-radius: 14px; font-size: 1.6rem; background: linear-gradient(135deg, #6366f1, #4f46e5); display: flex; align-items: center; justify-content: center; color: white; font-weight: 800; box-shadow: 0 8px 16px rgba(99, 102, 241, 0.3);">H</div>
            <h2 class="fw-bold text-gradient-primary">Reset Password</h2>
            <p class="text-secondary small">Set a new secure password for your HireWise AI account (minimum 6 characters).</p>
        </div>
        
        <form action="{{ url_for('auth.reset_password', token=token) }}" method="POST" onsubmit="return validatePasswords();">
            <!-- Password Input -->
            <div class="mb-3">
                <label for="password" class="form-label fw-semibold">New Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0 text-muted" style="border-radius: 12px 0 0 12px; border-color: var(--border-color);">
                        <i class="bi bi-lock"></i>
                    </span>
                    <input type="password" 
                           class="form-control form-control-custom border-start-0" 
                           id="password" 
                           name="password" 
                           placeholder="••••••••" 
                           style="border-radius: 0 12px 12px 0;"
                           minlength="6"
                           required>
                </div>
            </div>

            <!-- Confirm Password Input -->
            <div class="mb-4">
                <label for="confirm_password" class="form-label fw-semibold">Confirm Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0 text-muted" style="border-radius: 12px 0 0 12px; border-color: var(--border-color);">
                        <i class="bi bi-lock-fill"></i>
                    </span>
                    <input type="password" 
                           class="form-control form-control-custom border-start-0" 
                           id="confirm_password" 
                           name="confirm_password" 
                           placeholder="••••••••" 
                           style="border-radius: 0 12px 12px 0;"
                           minlength="6"
                           required>
                </div>
                <div id="password-feedback" class="text-danger small mt-1" style="display: none;"></div>
            </div>
            
            <!-- Submit Button -->
            <button type="submit" class="btn btn-primary w-100 py-3 fw-bold mb-3 shadow" style="border-radius: 12px; background: linear-gradient(135deg, #6366f1, #4f46e5); border: none; transition: all 0.3s ease;">
                Update Password
            </button>
        </form>
    </div>
</div>

<script>
function validatePasswords() {
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirm_password').value;
    const feedback = document.getElementById('password-feedback');
    
    if (password !== confirm) {
        feedback.innerText = "Passwords do not match.";
        feedback.style.display = 'block';
        return false;
    }
    feedback.style.display = 'none';
    return true;
}
</script>
{% endblock %}
