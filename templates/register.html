{% extends "base.html" %}

{% block title %}Sign Up - HireWise AI{% endblock %}

{% block content %}
<div class="container d-flex align-items-center justify-content-center" style="min-height: 80vh;">
    <div class="glass-card p-4 p-md-5 w-100" style="max-width: 480px; border-radius: 24px;">
        <div class="text-center mb-4">
            <div class="brand-logo mx-auto mb-3" style="width: 50px; height: 50px; border-radius: 12px; font-size: 1.5rem;">H</div>
            <h2 class="fw-bold text-gradient-primary">Create Account</h2>
            <p class="text-secondary small">Begin practicing for your placements today</p>
        </div>
        
        <form action="{{ url_for('auth.register') }}" method="POST">
            <!-- Username Input -->
            <div class="mb-3">
                <label for="username" class="form-label fw-semibold">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0 text-muted" style="border-radius: 10px 0 0 10px; border-color: var(--border-color);">
                        <i class="bi bi-person"></i>
                    </span>
                    <input type="text" 
                           class="form-control form-control-custom border-start-0" 
                           id="username" 
                           name="username" 
                           placeholder="johndoe" 
                           style="border-radius: 0 10px 10px 0;"
                           required>
                </div>
            </div>
            
            <!-- Email Input -->
            <div class="mb-3">
                <label for="email" class="form-label fw-semibold">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0 text-muted" style="border-radius: 10px 0 0 10px; border-color: var(--border-color);">
                        <i class="bi bi-envelope"></i>
                    </span>
                    <input type="email" 
                           class="form-control form-control-custom border-start-0" 
                           id="email" 
                           name="email" 
                           placeholder="johndoe@student.edu" 
                           style="border-radius: 0 10px 10px 0;"
                           required>
                </div>
            </div>
            
            <!-- Password Input -->
            <div class="mb-4">
                <label for="password" class="form-label fw-semibold">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0 text-muted" style="border-radius: 10px 0 0 10px; border-color: var(--border-color);">
                        <i class="bi bi-lock"></i>
                    </span>
                    <input type="password" 
                           class="form-control form-control-custom border-start-0" 
                           id="password" 
                           name="password" 
                           placeholder="••••••••" 
                           style="border-radius: 0 10px 10px 0;"
                           minlength="6"
                           required>
                </div>
                <div class="form-text text-muted small mt-1">Must be at least 6 characters.</div>
            </div>
            
            <!-- Submit Button -->
            <button type="submit" class="btn btn-primary w-100 py-3 fw-bold mb-3 shadow" style="border-radius: 10px; background: linear-gradient(135deg, #6366f1, #4f46e5); border: none;">
                Sign Up
            </button>
            
            <!-- Social Login Providers -->
            <div id="social-auth-section" class="my-4 text-center">
                <div class="d-flex align-items-center mb-3">
                    <hr class="flex-grow-1 border-secondary opacity-25">
                    <span class="px-2 text-secondary small">Or sign up with</span>
                    <hr class="flex-grow-1 border-secondary opacity-25">
                </div>
                <div class="d-flex flex-column gap-2">
                    <a href="{{ url_for('auth.oauth_login', provider='google') }}" class="btn btn-outline-light w-100 py-2.5 d-flex align-items-center justify-content-center gap-2" style="border-radius: 10px; border-color: rgba(255,255,255,0.1); color: var(--text-color); font-weight: 500; background: rgba(255,255,255,0.02);">
                        <i class="bi bi-google text-danger"></i> Continue with Google
                    </a>
                    <a href="{{ url_for('auth.oauth_login', provider='github') }}" class="btn btn-outline-light w-100 py-2.5 d-flex align-items-center justify-content-center gap-2" style="border-radius: 10px; border-color: rgba(255,255,255,0.1); color: var(--text-color); font-weight: 500; background: rgba(255,255,255,0.02);">
                        <i class="bi bi-github text-white"></i> Continue with GitHub
                    </a>
                </div>
            </div>
            
            <!-- Redirect Option -->
            <div class="text-center">
                <span class="text-secondary small">Already have an account? </span>
                <a href="{{ url_for('auth.login') }}" class="small fw-semibold text-decoration-none text-gradient-primary">Sign In</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
